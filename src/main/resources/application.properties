spring.application.name=WebProject
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/topupdb?characterEncoding=UTF-8&serverTimezone=Asia/Bangkok&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=Asia/Bangkok

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JSP Configuration (handled by WebConfig.java)
 spring.mvc.view.prefix=/WEB-INF/jsp/
 spring.mvc.view.suffix=.jsp

# Logging Configuration
logging.level.root=INFO
logging.level.com.springboot=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO